<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pokémon Rookies · Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream: #f4ead2;
    --label: #e0b559;
    --red: #7a1e2b;
    --body: 'Rubik', system-ui, sans-serif;
  }
  html, body{
    margin:0; padding:0; background: transparent; overflow:hidden;
    width:1920px; height:1080px;
    font-family: var(--body); color: var(--cream);
  }
  #stage{
    position: relative;
    width: 1920px;
    height: 1080px;
  }

  #bg-layout{
    position:absolute; left:0; top:0;
    width:1920px; height:1080px;
    z-index: 0;
  }

  #vidas-slot{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    z-index: 1;
  }
  #vidas-slot img{
    max-width: 100%;
    max-height: 100%;
    width:auto; height:auto;
    object-fit: contain;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.5));
  }

  .team-slot{
    position:absolute;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom: 14px;
    box-sizing:border-box;
    z-index: 1;
  }
  .team-slot img.mon{
    width: 130px;
    height: 130px;
    object-fit: contain;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,.6));
    margin-bottom: 6px;
  }
  .team-slot .mon-name{
    font-weight: 800;
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: .3px;
    color: var(--cream);
    text-shadow: 0 2px 3px rgba(0,0,0,.8), 0 0 6px rgba(0,0,0,.6);
    text-align:center;
    max-width: 185px;
    white-space: nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .team-slot.fainted img.mon{ filter: grayscale(1) brightness(.4) drop-shadow(0 3px 5px rgba(0,0,0,.6)); }
  .team-slot.fainted .mon-name{ color: #c99; text-decoration: line-through; }

  #errbox{
    position:absolute; left:40px; top:40px;
    max-width: 500px; padding:14px 18px; border-radius:12px;
    background: rgba(50,10,10,.9); border:1px solid #7a2a2a; color:#f0b0b0;
    font-size:16px; display:none;
    font-family: var(--body);
  }
</style>
</head>
<body>

<div id="stage">
  <img id="bg-layout" alt="">
  <div id="vidas-slot"></div>
  <div class="team-slot" id="slot-0"></div>

  <div class="team-slot" id="slot-2"></div>
  <div class="team-slot" id="slot-3"></div>
  <div class="team-slot" id="slot-4"></div>
  <div class="team-slot" id="slot-5"></div>
</div>
<div id="errbox"></div>

function pmdPortrait(dexId){
  const id = String(dexId || 1).padStart(4, '0');
  return `https://raw.githubusercontent.com/PMDCollab/SpriteCollab/master/portrait/${id}/Normal.png`;
}

function showError(msg){
  const box = document.getElementById('errbox');
  box.textContent = msg;
  box.style.display = 'block';
}

function applyBox(el, box){
  el.style.left = box.left + 'px';
  el.style.top = box.top + 'px';
  el.style.width = box.width + 'px';
  el.style.height = box.height + 'px';
}

function setupLayout(){
  // Fondo del layout, según el streamer
  const bgFile = LAYOUT_MAP[STREAMER_ID];
  if(bgFile){
    document.getElementById('bg-layout').src = 'layouts/' + encodeURIComponent(bgFile);
  }
  // Posiciones (rectangular o especial de Junzen)
  applyBox(document.getElementById('vidas-slot'), COORDS.vidas);
  COORDS.slots.forEach((box, i) => applyBox(document.getElementById(`slot-${i}`), box));
}

async function render(){
  const { data: streamer } = await supabaseClient.from('rookies_streamers').select('*').eq('id', STREAMER_ID).single();
  if(!streamer){
    showError(`No encontré ningún streamer con id "${STREAMER_ID}". Revisá el ?streamer= en la URL del Browser Source.`);
    return;
  }

  // ---- Número de vidas ----
  const vidas = Math.max(0, Math.min(MAX_VIDAS_ASSET, streamer.vidas || 0));
  const vidasSlot = document.getElementById('vidas-slot');
  vidasSlot.innerHTML = `<img src="${VIDAS_NUMBERS[vidas]}" alt="${vidas} vidas">`;

  // ---- Equipo activo ----
  const { data: teamData } = await supabaseClient.from('rookies_team_slots').select('*').eq('streamer_id', STREAMER_ID).order('slot');
  const team = teamData || [];

  for(let i = 0; i < 6; i++){
    const el = document.getElementById(`slot-${i}`);
    const t = team[i];
    if(!t || !t.pokemon_name){
      el.className = 'team-slot';
      el.innerHTML = '';
      continue;
    }
    el.className = 'team-slot' + (t.fainted ? ' fainted' : '');
    el.innerHTML = `
      <img class="mon" src="${t.sprite_url || pmdPortrait(t.dex_id)}" alt="${t.pokemon_name}"
           onerror="this.style.display='none';">
      <div class="mon-name">${t.pokemon_name}</div>
    `;
  }
}

if(!STREAMER_ID){
  showError('Falta el parámetro ?streamer= en la URL. Ejemplo: overlay.html?streamer=guti');
} else {
  setupLayout();
  render();
  supabaseClient.channel(`overlay-${STREAMER_ID}`)
    .on('postgres_changes', { event:'*', schema:'public', table:'rookies_streamers', filter:`id=eq.${STREAMER_ID}` }, render)
    .on('postgres_changes', { event:'*', schema:'public', table:'rookies_team_slots', filter:`streamer_id=eq.${STREAMER_ID}` }, render)
    .subscribe();
}
</script>
